# ============================================================================
# VDP Analytics — Test Suite (CI gate)
# ============================================================================
# Runs on every push and pull request so regressions are caught BEFORE they
# reach main/production. This is the fail-safe that would have blocked the
# "Cannot operate on a closed database" outage:
# tests/test_connection_safety.py fails if any code closes the shared
# get_connection() handle, or if get_connection() stops self-healing.
# ============================================================================

name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # Tests stub streamlit/plotly/anthropic, so only the data libs are needed.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pytest openpyxl

      - name: Run test suite
        run: python -m pytest
